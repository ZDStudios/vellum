<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4a6cf7"/>
      <stop offset="0.55" stop-color="#8a63ff"/>
      <stop offset="1" stop-color="#f4a340"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8ecff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1c1c1c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="960" height="300" rx="24" fill="url(#bg)"/>
  <rect width="960" height="300" rx="24" fill="#000000" opacity="0.04"/>

  <!-- logo tile -->
  <g filter="url(#shadow)">
    <rect x="72" y="106" width="88" height="88" rx="22" fill="url(#logo)"/>
    <text x="116" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#4a6cf7" text-anchor="middle">V</text>
  </g>

  <text x="196" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">Vellum</text>
  <text x="198" y="192" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#ffffff" opacity="0.92">A beautiful, open-source document workspace.</text>
  <text x="198" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" opacity="0.75">Block editor · REST API · MCP server · Claude skill · Node / Python / Docker</text>
</svg>
